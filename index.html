<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mise à Jour Majeure // Le Monde de Sarah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep:      #0b0b0e;
      --card-bg:      rgba(20, 20, 26,  0.8);
      --border-lux:   rgba(212, 175, 55, 0.35);
      --gold:         #d4af37;
      --gold-light:   #f3e5ab;
      --text-main:    #f4f1ea;
      --text-muted:   #9e95b0;
      --accent:       #6c5ce7;

      --f-title: 'Cinzel', serif;
      --f-body:  'Plus Jakarta Sans', sans-serif;
      --f-mono:  'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: var(--f-body);
      background-color: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
      position: relative;
    }

    /* Fond épuré et luxueux */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .ambient-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.15;
    }

    .glow-1 { width: 50vw; height: 50vw; background: #4834d4; top: -15vw; left: -10vw; }
    .glow-2 { width: 45vw; height: 45vw; background: #d4af37; bottom: -15vw; right: -10vw; }

    /* Carte de commandement principale */
    .command-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 620px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-lux);
      border-radius: 24px;
      padding: 3.5rem 2.8rem;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    /* Badge de statut */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      background: rgba(212, 175, 55, 0.08);
      border: 1px solid var(--border-lux);
      color: var(--gold-light);
      padding: 0.5rem 1.4rem;
      border-radius: 9999px;
      font-family: var(--f-mono);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background-color: var(--gold);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--gold);
      animation: blink 2s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    /* Élément graphique central discret */
    .emblem-container {
      position: relative;
      width: 70px;
      height: 70px;
      margin: 0 auto 1.8rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-lux);
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.03);
    }

    .emblem-core {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }

    /* Typographie */
    h1 {
      font-family: var(--f-title);
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 0.6rem;
      color: var(--text-main);
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      letter-spacing: 0.03em;
      margin-bottom: 2rem;
    }

    /* Barre de progression */
    .progress-section {
      margin-bottom: 2.2rem;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--f-mono);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 9999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--gold));
      border-radius: 9999px;
      transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .time-remaining {
      font-family: var(--f-mono);
      font-size: 0.75rem;
      color: var(--gold-light);
      margin-top: 0.8rem;
      opacity: 0.85;
    }

    /* Bouton principal */
    .action-btn {
      font-family: var(--f-title);
      font-weight: 600;
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--bg-deep);
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      border: none;
      padding: 1rem 2.2rem;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(212, 175, 55, 0.25);
      transition: all 0.3s ease;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(212, 175, 55, 0.4);
    }

    /* Modale des Énigmes */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 3, 8, 0.85);
      backdrop-filter: blur(16px);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .puzzle-card {
      width: 100%;
      max-width: 520px;
      background: rgba(18, 14, 28, 0.95);
      border: 1px solid var(--border-lux);
      border-radius: 24px;
      padding: 2.8rem;
      box-shadow: 0 30px 60px rgba(0,0,0,0.7);
      text-align: center;
      transform: scale(0.95);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.active .puzzle-card {
      transform: scale(1);
    }

    .puzzle-header {
      font-family: var(--f-mono);
      font-size: 0.72rem;
      color: var(--gold);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
    }

    .puzzle-question {
      font-family: var(--f-title);
      font-size: 1.15rem;
      line-height: 1.6;
      margin-bottom: 2rem;
      color: var(--text-main);
    }

    .puzzle-input-row {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1.2rem;
    }

    .puzzle-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 0.9rem 1.2rem;
      color: #fff;
      font-family: var(--f-body);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .puzzle-input:focus {
      border-color: var(--gold);
    }

    .puzzle-submit-btn {
      background: var(--text-main);
      color: var(--bg-deep);
      border: none;
      padding: 0 1.5rem;
      border-radius: 12px;
      font-family: var(--f-title);
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .puzzle-submit-btn:hover {
      background: var(--gold);
    }

    .puzzle-feedback {
      font-family: var(--f-mono);
      font-size: 0.78rem;
      min-height: 24px;
      margin-bottom: 1.5rem;
    }

    .close-puzzle-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      font-family: var(--f-mono);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: color 0.3s ease;
    }

    .close-puzzle-btn:hover {
      color: var(--text-main);
    }

    .ambient-hint {
      font-family: var(--f-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2rem;
      letter-spacing: 0.05em;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="bg-layer">
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
  </div>

  <div class="command-card">
    <div class="status-badge">
      <span class="pulse-dot"></span>
      <span>Mise à Niveau Majeure // Séquence Active</span>
    </div>

    <div class="emblem-container">
      <div class="emblem-core"></div>
    </div>

    <h1>Le Monde de Sarah</h1>
    <span class="subtitle">Refonte architecturale et déploiement des protocoles d'élite.</span>
    
    <div class="progress-section">
      <div class="progress-header">
        <span>SYNCHRONISATION GLOBALE</span>
        <span id="percent-label" style="color: var(--gold);">0%</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="time-remaining" id="time-remaining">Optimisation en cours...</div>
    </div>

    <button class="action-btn" id="open-puzzle-btn">
      Accéder aux Séquences d'Énigmes
    </button>

    <div class="ambient-hint">✦ Interface hautement sécurisée</div>
  </div>

  <!-- Modale des Énigmes -->
  <div class="modal-overlay" id="puzzle-modal">
    <div class="puzzle-card">
      <div class="puzzle-header" id="puzzle-counter">Séquence 01 / 10</div>
      <div class="puzzle-question" id="puzzle-text">Initialisation du protocole...</div>

      <div class="puzzle-input-row">
        <input type="text" class="puzzle-input" id="puzzle-input" placeholder="Entrez la clé de validation..." autofocus>
        <button class="puzzle-submit-btn" id="puzzle-submit">Valider</button>
      </div>

      <div class="puzzle-feedback" id="puzzle-feedback"></div>

      <button class="close-puzzle-btn" id="close-puzzle-btn">[ Fermer temporairement ]</button>
    </div>
  </div>

  <script>
    // --- Progression vers 15h00 ---
    const startTime = new Date(2026, 9, 19, 0, 50, 0).getTime();
    const endTime = new Date(2026, 9, 19, 15, 0, 0).getTime();
    const progressFill = document.getElementById('progress-fill');
    const percentLabel = document.getElementById('percent-label');
    const timeRemaining = document.getElementById('time-remaining');

    function updateProgress() {
      const now = new Date().getTime();
      const totalDuration = endTime - startTime;
      const elapsed = now - startTime;
      let percentage = (elapsed / totalDuration) * 100;
      if (percentage < 1) percentage = 1;
      if (percentage >= 100) percentage = 100;

      const roundedPct = Math.floor(percentage);
      percentLabel.innerText = roundedPct + "%";
      progressFill.style.width = percentage + "%";

      const timeLeftMs = endTime - now;
      if (timeLeftMs > 0) {
        const hours = Math.floor(timeLeftMs / (1000 * 60 * 60));
        const minutes = Math.floor((timeLeftMs % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((timeLeftMs % (1000 * 60)) / 1000);
        timeRemaining.innerText = `Déploiement complet prévu dans : ${hours}h ${minutes}m ${seconds}s`;
      } else {
        timeRemaining.innerText = "✦ Séquence finale atteinte. Ouverture imminente.";
      }
    }
    setInterval(updateProgress, 1000);
    updateProgress();

    // --- Gestion des 10 Énigmes ---
    const riddles = [
      { q: "Je n'ai pas de voix, mais je réponds fidèlement quand on m'appelle. Qui suis-je ?", a: ["l'echo", "echo"] },
      { q: "Plus j'en prends, plus j'en laisse derrière moi lors de mon voyage. Que suis-je ?", a: ["les pas", "pas", "empreintes"] },
      { q: "Qu'est-ce qui possède de multiples dents mais ne peut en aucun cas mordre ?", a: ["un peigne", "peigne"] },
      { q: "Je suis entièrement constellé de perforations, et pourtant je parviens à retenir l'eau. Que suis-je ?", a: ["une eponge", "epongebob", "eponge"] },
      { q: "Qu'est-ce qui commence par la lettre E, s'achève par une lettre E, mais ne contient qu'un seul caractère ? ", a: ["une enveloppe", "enveloppe"] },
      { q: "Je me précipite continuellement vers le sol, mais je ne subis jamais la moindre blessure. Qui suis-je ?", a: ["la pluie", "pluie", "la neige", "neige"] },
      { q: "Qu'est-ce qui grandit au fil de son existence avant de rajeunir au moment de s'éteindre ?", a: ["une bougie", "bougie"] },
      { q: "Je suis capable de parcourir le monde entier tout en demeurant strictement immobile dans mon coin. Qui suis-je ?", a: ["un timbre", "timbre", "timbre poste"] },
      { q: "Quel être vivant se déplace sur quatre appuis à l'aube, deux à midi, et trois au crépuscule ?", a: ["l'homme", "homme", "humain"] },
      { q: "Quel est le pilier absolu et le plus précieux de cet univers ?", a: ["l'amitie", "amitie", "l'amour", "amour", "sarah", "ice"] }
    ];

    let solvedCount = 0;

    const modal = document.getElementById('puzzle-modal');
    const openBtn = document.getElementById('open-puzzle-btn');
    const closeBtn = document.getElementById('close-puzzle-btn');
    const submitBtn = document.getElementById('puzzle-submit');
    const puzzleInput = document.getElementById('puzzle-input');
    const puzzleText = document.getElementById('puzzle-text');
    const puzzleCounter = document.getElementById('puzzle-counter');
    const puzzleFeedback = document.getElementById('puzzle-feedback');

    openBtn.addEventListener('click', () => {
      modal.classList.add('active');
      loadRiddle();
      setTimeout(() => puzzleInput.focus(), 100);
    });

    closeBtn.addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });

    function loadRiddle() {
      if (solvedCount >= riddles.length) {
        puzzleCounter.innerText = "✦ SYSTÈME ENTIÈREMENT CALIBRÉ";
        puzzleText.innerText = "Toutes les séquences ont été validées avec succès. Le portail d'accès s'apprête à s'ouvrir.";
        puzzleInput.style.display = 'none';
        submitBtn.style.display = 'none';
        puzzleFeedback.innerHTML = "<span style='color:var(--gold-light);'>Accès administrateur autorisé.</span>";
        return;
      }
      puzzleCounter.innerText = `Séquence 0${solvedCount + 1} / 10`;
      puzzleText.innerText = riddles[solvedCount].q;
      puzzleInput.value = '';
      puzzleFeedback.innerText = '';
    }

    function checkAnswer() {
      if (solvedCount >= riddles.length) return;
      const userAns = puzzleInput.value.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      const validAnswers = riddles[solvedCount].a;

      if (validAnswers.some(ans => userAns.includes(ans))) {
        solvedCount++;
        puzzleFeedback.innerHTML = "<span style='color:var(--gold-light);'>✓ Séquence validée. Passage à la suivante...</span>";
        
        setTimeout(() => {
          loadRiddle();
        }, 1200);
      } else {
        puzzleFeedback.innerHTML = "<span style='color:#e06c75;'>✕ Clé incorrecte. Nouvelle tentative requise.</span>";
      }
    }

    submitBtn.addEventListener('click', checkAnswer);
    puzzleInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkAnswer();
    });
  </script>
</body>
</html>
