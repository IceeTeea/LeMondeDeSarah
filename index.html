<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mise à jour en cours — Mode Maintenance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #030508;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow: hidden;
      position: relative;
    }

    /* Arrière-plan dynamique avec canvas */
    #bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Carte principale */
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 540px;
      background: rgba(10, 14, 23, 0.7);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 28px;
      padding: 3.5rem 2.5rem;
      text-align: center;
      box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.9),
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.35);
      color: #e2c262;
      padding: 0.45rem 1.15rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background-color: #e2c262;
      border-radius: 50%;
      box-shadow: 0 0 10px #e2c262;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 0.85rem;
      background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 50%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.25;
    }

    /* Message dynamique */
    .status-text {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.65;
      font-weight: 300;
      min-height: 3.2em;
      margin-bottom: 1.5rem;
      transition: opacity 0.4s ease;
    }

    /* Cercle de statut animé */
    .loader-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 1.5rem auto;
    }

    .loader-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .loader-bg {
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 4;
      fill: none;
    }

    .loader-circle {
      stroke: url(#gold-gradient);
      stroke-width: 4;
      fill: none;
      stroke-linecap: round;
      stroke-dasharray: 283;
      stroke-dashoffset: 283;
      transition: stroke-dashoffset 0.5s ease;
    }

    .loader-number {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: #e2c262;
    }

    /* Compte à rebours temps restant */
    .time-remaining {
      color: #cbd5e1;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      margin-bottom: 2rem;
    }

    /* Étapes d'avancement */
    .step-indicator {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .step-dot {
      width: 24px;
      height: 4px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.5s ease;
    }

    .step-dot.active {
      background: #e2c262;
      box-shadow: 0 0 10px rgba(226, 194, 98, 0.5);
    }

    .footer-text {
      font-size: 0.8rem;
      color: #64748b;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <!-- Particules animées -->
  <canvas id="bg-canvas"></canvas>

  <div class="container">
    <div class="brand-badge">
      <span class="pulse-dot"></span>
      Mise à jour en direct
    </div>

    <h1>Maintenance du site</h1>
    
    <p class="status-text" id="status-text">Initialisation et déploiement des éléments...</p>

    <!-- Anneau de progression -->
    <div class="loader-wrapper">
      <svg class="loader-svg" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e2c262" />
            <stop offset="100%" stop-color="#a855f7" />
          </linearGradient>
        </defs>
        <circle class="loader-bg" cx="50" cy="50" r="45"></circle>
        <circle class="loader-circle" id="progress-circle" cx="50" cy="50" r="45"></circle>
      </svg>
      <div class="loader-number" id="progress-percent">1%</div>
    </div>

    <div class="time-remaining" id="time-remaining">Fin prévue aujourd'hui à 12:00</div>

    <!-- Indicateurs d'étapes -->
    <div class="step-indicator">
      <div class="step-dot active" id="dot-1"></div>
      <div class="step-dot" id="dot-2"></div>
      <div class="step-dot" id="dot-3"></div>
    </div>

    <div class="footer-text">Merci pour votre patience &bull; Rendez-vous à 12h00</div>
  </div>

  <script>
    // 1. Animation des particules en arrière-plan
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 1.8 + 0.5;
        this.speedY = Math.random() * -0.5 - 0.2;
        this.opacity = Math.random() * 0.5 + 0.1;
      }
      update() {
        this.y += this.speedY;
        if (this.y < 0) this.reset();
      }
      draw() {
        ctx.fillStyle = `rgba(226, 194, 98, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 40; i++) {
      particles.push(new Particle());
    }

    function animateBg() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateBg);
    }
    animateBg();

    // 2. Calcul du pourcentage en temps réel jusqu'au 19/10/2026 à 12h00
    const startTime = new Date(2026, 9, 19, 0, 50, 0).getTime(); // Début : 19/10/2026 à 00:50
    const endTime = new Date(2026, 9, 19, 12, 0, 0).getTime();   // Fin : 19/10/2026 à 12:00

    const circle = document.getElementById('progress-circle');
    const percentText = document.getElementById('progress-percent');
    const statusText = document.getElementById('status-text');
    const timeRemaining = document.getElementById('time-remaining');
    const dot1 = document.getElementById('dot-1');
    const dot2 = document.getElementById('dot-2');
    const dot3 = document.getElementById('dot-3');
    const maxDash = 283;

    function updateRealProgress() {
      const now = new Date().getTime();
      const totalDuration = endTime - startTime;
      const elapsed = now - startTime;

      let percentage = (elapsed / totalDuration) * 100;
      
      // Sécurité pour rester entre 1% et 100%
      if (percentage < 1) percentage = 1;
      if (percentage >= 100) percentage = 100;

      const roundedPercent = Math.floor(percentage);
      percentText.innerText = roundedPercent + "%";

      // Animation du cercle SVG
      const offset = maxDash - (percentage / 100) * maxDash;
      circle.style.strokeDashoffset = offset;

      // Calcul du temps restant
      const timeLeftMs = endTime - now;
      if (timeLeftMs > 0) {
        const hours = Math.floor(timeLeftMs / (1000 * 60 * 60));
        const minutes = Math.floor((timeLeftMs % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((timeLeftMs % (1000 * 60)) / 1000);
        timeRemaining.innerText = `Temps restant : ${hours}h ${minutes}m ${seconds}s`;
      } else {
        timeRemaining.innerText = "Mise à jour terminée ! Ouverture imminente...";
      }

      // Adaptation des textes selon le pourcentage réel
      if (percentage < 33) {
        statusText.innerText = "Optimisation des bases de données et des visuels...";
        dot1.classList.add('active');
        dot2.classList.remove('active');
        dot3.classList.remove('active');
      } else if (percentage < 75) {
        statusText.innerText = "Déploiement des nouvelles fonctionnalités...";
        dot1.classList.add('active');
        dot2.classList.add('active');
        dot3.classList.remove('active');
      } else if (percentage < 100) {
        statusText.innerText = "Dernières vérifications de sécurité avant réouverture...";
        dot1.classList.add('active');
        dot2.classList.add('active');
        dot3.classList.add('active');
      } else {
        statusText.innerText = "Finalisation terminée ! Le site va rouvrir.";
        dot1.classList.add('active');
        dot2.classList.add('active');
        dot3.classList.add('active');
      }
    }

    // Mise à jour toutes les secondes
    setInterval(updateRealProgress, 1000);
    updateRealProgress();
  </script>

</body>
</html>
