<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance — Édition Limitée</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #030508;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      overflow-x: hidden;
      position: relative;
    }

    /* Lumières d'ambiance d'arrière-plan */
    .bg-glow-1 {
      position: absolute;
      top: -15%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    .bg-glow-2 {
      position: absolute;
      bottom: -10%;
      right: 10%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
    }

    /* Carte principale */
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 580px;
      background: rgba(10, 14, 23, 0.75);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 28px;
      padding: 3.5rem 3rem;
      text-align: center;
      box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.9),
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    /* Badge doré animé */
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.03));
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: #e2c262;
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background-color: #e2c262;
      border-radius: 50%;
      box-shadow: 0 0 10px #e2c262;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    /* Titre d'exception */
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }

    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.7;
      font-weight: 300;
      margin-bottom: 2.5rem;
    }

    /* Compte à rebours chic */
    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .time-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 1.25rem 0.5rem;
    }

    .time-value {
      font-family: 'Cinzel', serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: #ffffff;
      display: block;
      margin-bottom: 0.25rem;
    }

    .time-label {
      font-size: 0.7rem;
      color: #64748b;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* Barre de progression épurée */
    .progress-container {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 2rem;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 35%;
      background: linear-gradient(90deg, transparent, #e2c262, transparent);
      animation: shimmer 2.5s infinite ease-in-out;
    }

    @keyframes shimmer {
      0% { left: -35%; }
      100% { left: 100%; }
    }

    .footer-text {
      font-size: 0.8rem;
      color: #475569;
      letter-spacing: 0.05em;
    }

    @media (max-width: 480px) {
      .container { padding: 2.5rem 1.5rem; }
      h1 { font-size: 1.75rem; }
    }
  </style>
</head>
<body>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="container">
    <div class="brand-badge">
      <span class="pulse-dot"></span>
      Mise à jour privée
    </div>

    <h1>Excellence en Préparation</h1>
    
    <p>Nous perfectionnons actuellement l'expérience. Le site sera de nouveau accessible dans un instant avec une toute nouvelle version.</p>

    <!-- Compte à rebours dynamique -->
    <div class="countdown-grid">
      <div class="time-box">
        <span class="time-value" id="hours">00</span>
        <span class="time-label">Heures</span>
      </div>
      <div class="time-box">
        <span class="time-value" id="minutes">45</span>
        <span class="time-label">Minutes</span>
      </div>
      <div class="time-box">
        <span class="time-value" id="seconds">00</span>
        <span class="time-label">Secondes</span>
      </div>
    </div>

    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>

    <div class="footer-text">Merci pour votre patience &bull; À très vite</div>
  </div>

  <script>
    // Compte à rebours factice animé pour l'effet visuel
    let totalSeconds = 2700; // 45 minutes

    function updateTimer() {
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      document.getElementById('hours').innerText = String(hours).padStart(2, '0');
      document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
      document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');

      if (totalSeconds > 0) {
        totalSeconds--;
      }
    }

    setInterval(updateTimer, 1000);
    updateTimer();
  </script>

</body>
</html>
