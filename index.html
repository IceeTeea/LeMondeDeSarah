<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chantier en Cours — Le Monde de Sarah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Unbounded:wght@700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper:      #FBF3E7;
      --ink:        #1C1030;
      --grape:      #6C2BD9;
      --magenta:    #FF3C8E;
      --tangerine:  #FF8A3D;
      --lime:       #C7F13B;
      --warning:    #FFD700;

      --f-display: 'Unbounded', sans-serif;
      --f-script:  'Caveat', cursive;
      --f-body:    'Plus Jakarta Sans', sans-serif;
      --f-mono:    'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: var(--f-body);
      background-color: var(--ink);
      color: var(--paper);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
      position: relative;
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: repeating-linear-gradient(
        45deg,
        rgba(28, 16, 48, 0.9),
        rgba(28, 16, 48, 0.9) 40px,
        rgba(255, 138, 61, 0.05) 40px,
        rgba(255, 138, 61, 0.05) 80px
      );
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      mix-blend-mode: screen;
    }

    .blob-1 { width: 50vw; height: 50vw; background: var(--tangerine); top: -15vw; left: -10vw; animation: blobFloat 24s ease-in-out infinite; }
    .blob-2 { width: 45vw; height: 45vw; background: var(--magenta); bottom: -15vw; right: -10vw; animation: blobFloat 20s ease-in-out infinite reverse; }

    @keyframes blobFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(3vw, 4vw) scale(1.1); }
    }

    #stars-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .command-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 600px;
      background: #140b24;
      color: var(--paper);
      border: 4px solid var(--tangerine);
      border-radius: 32px;
      padding: 3.2rem 2.5rem;
      text-align: center;
      box-shadow: 12px 12px 0 var(--magenta);
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--warning);
      border: 2px solid var(--ink);
      color: var(--ink);
      padding: 0.5rem 1.2rem;
      border-radius: 9999px;
      font-family: var(--f-mono);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      box-shadow: 3px 3px 0 var(--ink);
    }

    .pulse-dot {
      width: 9px;
      height: 9px;
      background-color: var(--magenta);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--magenta);
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.2; transform: scale(0.7); }
    }

    .orb-container {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 1.5rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orb-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px dashed var(--tangerine);
      animation: rotateRing 10s linear infinite;
    }

    .orb-ring-reverse {
      position: absolute;
      width: 75%;
      height: 75%;
      border-radius: 50%;
      border: 3px solid var(--magenta);
      border-top-color: transparent;
      animation: rotateRing 5s linear infinite reverse;
    }

    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .orb-core {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--warning), var(--tangerine) 50%, var(--magenta) 100%);
      box-shadow: 0 0 30px var(--tangerine);
      animation: orbPulse 2.5s infinite ease-in-out;
      position: relative;
      z-index: 2;
    }

    @keyframes orbPulse {
      0%, 100% { transform: scale(0.92); }
      50% { transform: scale(1.1); box-shadow: 0 0 45px var(--warning); }
    }

    h1 {
      font-family: var(--f-display);
      font-size: clamp(1.5rem, 4.5vw, 2.1rem);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 0.5rem;
      color: var(--paper);
    }

    .subtitle {
      font-family: var(--f-script);
      font-size: 1.7rem;
      color: var(--tangerine);
      transform: rotate(-1.5deg);
      display: block;
      margin-bottom: 1.25rem;
    }

    .status-text {
      color: var(--paper);
      font-size: 0.95rem;
      line-height: 1.6;
      opacity: 0.9;
      min-height: 2.8em;
      margin-bottom: 1.75rem;
    }

    .progress-section {
      margin-bottom: 1.75rem;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--f-mono);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--warning);
      margin-bottom: 0.5rem;
    }

    .progress-bar-container {
      width: 100%;
      height: 14px;
      background: rgba(251, 243, 231, 0.1);
      border: 2px solid var(--tangerine);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 1%;
      background: linear-gradient(90deg, var(--warning), var(--tangerine), var(--magenta));
      border-radius: 9999px;
      transition: width 0.5s ease;
    }

    .time-remaining {
      font-family: var(--f-mono);
      font-size: 0.8rem;
      color: var(--paper);
      margin-top: 0.75rem;
      opacity: 0.85;
    }

    .action-btn {
      font-family: var(--f-display);
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--ink);
      background: var(--warning);
      border: 2px solid var(--warning);
      padding: 0.85em 1.6em;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.6em;
      box-shadow: 4px 4px 0 var(--magenta);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      margin-top: 0.5rem;
    }

    .action-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--magenta);
    }

    /* Modale des Énigmes */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 5, 20, 0.9);
      backdrop-filter: blur(12px);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .puzzle-card {
      width: 100%;
      max-width: 540px;
      background: #140b24;
      border: 3px solid var(--tangerine);
      border-radius: 28px;
      padding: 2.2rem;
      box-shadow: 0 0 40px rgba(255, 138, 61, 0.25);
      color: var(--paper);
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.active .puzzle-card {
      transform: scale(1);
    }

    .puzzle-header {
      font-family: var(--f-mono);
      font-size: 0.8rem;
      color: var(--warning);
      margin-bottom: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .puzzle-question {
      font-family: var(--f-display);
      font-size: 1.05rem;
      line-height: 1.4;
      margin-bottom: 1.5rem;
      color: var(--paper);
    }

    .puzzle-input-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .puzzle-input {
      flex: 1;
      background: #0d0617;
      border: 2px solid var(--tangerine);
      border-radius: 12px;
      padding: 0.8rem 1rem;
      color: #fff;
      font-family: var(--f-body);
      font-size: 0.9rem;
      outline: none;
    }

    .puzzle-submit-btn {
      background: var(--warning);
      color: var(--ink);
      border: none;
      padding: 0 1.2rem;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--f-mono);
    }

    .puzzle-feedback {
      font-family: var(--f-mono);
      font-size: 0.82rem;
      min-height: 25px;
      margin-bottom: 1rem;
    }

    .close-puzzle-btn {
      background: transparent;
      color: rgba(251, 243, 231, 0.6);
      border: 1px solid rgba(251, 243, 231, 0.2);
      padding: 0.5rem 1.2rem;
      border-radius: 999px;
      font-family: var(--f-mono);
      font-size: 0.78rem;
      cursor: pointer;
    }

    .interactive-hint {
      font-family: var(--f-script);
      font-size: 1.2rem;
      color: var(--tangerine);
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="bg-layer">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <canvas id="stars-canvas"></canvas>
  </div>

  <div class="command-card" id="main-card">
    <div class="status-badge" id="badge-container">
      <span class="pulse-dot"></span>
      <span id="badge-text">🚧 ENIGMES DU CHANTIER</span>
    </div>

    <div class="orb-container" id="orb-container">
      <div class="orb-ring"></div>
      <div class="orb-ring-reverse"></div>
      <div class="orb-core"></div>
    </div>

    <h1 id="main-title">Chantier Spatial Majeur</h1>
    <span class="subtitle" id="main-subtitle">Résous les énigmes pour débloquer le site...</span>
    
    <p class="status-text" id="status-text">Énigmes résolues : <span id="solved-count">0</span> / 10</p>

    <div class="progress-section">
      <div class="progress-header">
        <span>Progression des Énigmes</span>
        <span id="percent-label" style="color: var(--warning); font-weight: 700;">0%</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
      </div>
      <div class="time-remaining" id="time-remaining">Objectif : Résoudre les 10 énigmes !</div>
    </div>

    <button class="action-btn" id="open-puzzle-btn">
      🧩 Résoudre les Énigmes
    </button>

    <div class="interactive-hint">✨ Clique n'importe où pour faire jaillir des étincelles</div>
  </div>

  <!-- Modale des Énigmes -->
  <div class="modal-overlay" id="puzzle-modal">
    <div class="puzzle-card">
      <div class="puzzle-header" id="puzzle-counter">Énigme 1 sur 10</div>
      <div class="puzzle-question" id="puzzle-text">Chargement de l'énigme...</div>

      <div class="puzzle-input-row">
        <input type="text" class="puzzle-input" id="puzzle-input" placeholder="Ta réponse ici..." autofocus>
        <button class="puzzle-submit-btn" id="puzzle-submit">Valider</button>
      </div>

      <div class="puzzle-feedback" id="puzzle-feedback"></div>

      <button class="close-puzzle-btn" id="close-puzzle-btn">Fermer pour l'instant</button>
    </div>
  </div>

  <script>
    // --- Canvas Étincelles ---
    const canvas = document.getElementById('stars-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let stars = [];
    let sparks = [];

    function initCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      stars = [];
      for (let i = 0; i < 70; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 1.5 + 0.3,
          phase: Math.random() * Math.PI * 2,
          speed: 0.4 + Math.random() * 0.8
        });
      }
    }
    window.addEventListener('resize', initCanvas);
    initCanvas();

    window.addEventListener('click', (e) => {
      if (e.target.closest('.puzzle-card')) return;
      const colors = ['#FF3C8E', '#FF8A3D', '#FFD700', '#C7F13B', '#ffffff'];
      for (let i = 0; i < 14; i++) {
        sparks.push({
          x: e.clientX,
          y: e.clientY,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          size: Math.random() * 5 + 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 1.2
        });
      }
    });

    function renderBackground(t) {
      ctx.clearRect(0, 0, width, height);
      stars.forEach(s => {
        const tw = 0.5 + 0.5 * Math.sin(s.phase + t * 0.001 * s.speed);
        ctx.globalAlpha = 0.2 + tw * 0.6;
        ctx.fillStyle = '#FF8A3D';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });

      for (let i = sparks.length - 1; i >= 0; i--) {
        let p = sparks[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.025;
        if (p.life <= 0) {
          sparks.splice(i, 1);
        } else {
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.life;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(renderBackground);
    }
    requestAnimationFrame(renderBackground);

    // --- Liste des 10 Énigmes ---
    const riddles = [
      { q: "Je n'ai pas de voix, mais je réponds quand on m'appelle. Qui suis-je ?", a: ["l'echo", "echo"] },
      { q: "Plus j'en prends, plus j'en laisse derrière moi. Que suis-je ?", a: ["les pas", "pas", "empreintes"] },
      { q: "Qu'est-ce qui a des dents mais ne mord pas ?", a: ["un peigne", "peigne"] },
      { q: "Je suis plein de trous, mais je retiens pourtant l'eau. Que suis-je ?", a: ["une eponge", "eponge"] },
      { q: "Qu'est-ce qui commence par un E, se termine par un E, et ne contient qu'une seule lettre ?", a: ["une enveloppe", "enveloppe"] },
      { q: "Je tombe de haut, mais je ne me blesse jamais. Qui suis-je ?", a: ["la pluie", "pluie", "la neige", "neige"] },
      { q: "Qu'est-ce qui grandit en vieillissant et rajeunit en mourant ?", a: ["une bougie", "bougie"] },
      { q: "Je peux faire le tour du monde en restant toujours dans mon coin. Qui suis-je ?", a: ["un timbre", "timbre", "un timbre poste"] },
      { q: "Qu'est-ce qui a quatre pattes le matin, deux à midi, et trois le soir ?", a: ["l'homme", "homme", "humain"] },
      { q: "Quel est le métal le plus précieux dans l'univers de Sarah ?", a: ["l'amitie", "amitie", "l'amour", "amour", "sarah", "ice"] }
    ];

    let currentRiddleIndex = 0;
    let solvedCount = 0;

    const modal = document.getElementById('puzzle-modal');
    const openBtn = document.getElementById('open-puzzle-btn');
    const closeBtn = document.getElementById('close-puzzle-btn');
    const submitBtn = document.getElementById('puzzle-submit');
    const puzzleInput = document.getElementById('puzzle-input');
    const puzzleText = document.getElementById('puzzle-text');
    const puzzleCounter = document.getElementById('puzzle-counter');
    const puzzleFeedback = document.getElementById('puzzle-feedback');
    const solvedCountSpan = document.getElementById('solved-count');
    const percentLabel = document.getElementById('percent-label');
    const progressFill = document.getElementById('progress-fill');
    const statusText = document.getElementById('status-text');

    openBtn.addEventListener('click', () => {
      modal.classList.add('active');
      loadRiddle();
      setTimeout(() => puzzleInput.focus(), 100);
    });

    closeBtn.addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });

    function loadRiddle() {
      if (solvedCount >= riddles.length) {
        puzzleCounter.innerText = "✨ TOUTES LES ÉNIGMES RÉSOLUES !";
        puzzleText.innerText = "Félicitations ! Le chantier cosmique est entièrement validé.";
        puzzleInput.style.display = 'none';
        submitBtn.style.display = 'none';
        puzzleFeedback.innerHTML = "<span style='color:var(--lime); font-weight:bold;'>Ouverture des portes imminente... 🚀</span>";
        return;
      }
      puzzleCounter.innerText = `Énigme ${solvedCount + 1} sur 10`;
      puzzleText.innerText = riddles[solvedCount].q;
      puzzleInput.value = '';
      puzzleFeedback.innerText = '';
    }

    function checkAnswer() {
      if (solvedCount >= riddles.length) return;
      const userAns = puzzleInput.value.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      const validAnswers = riddles[solvedCount].a;

      if (validAnswers.some(ans => userAns.includes(ans))) {
        solvedCount++;
        solvedCountSpan.innerText = solvedCount;
        
        const pct = (solvedCount / 10) * 100;
        percentLabel.innerText = pct + "%";
        progressFill.style.width = pct + "%";

        puzzleFeedback.innerHTML = "<span style='color:var(--lime);'>🎉 Bonne réponse ! Passage à l'énigme suivante...</span>";
        
        setTimeout(() => {
          loadRiddle();
        }, 1200);
      } else {
        puzzleFeedback.innerHTML = "<span style='color:#FF3C8E;'>❌ Mauvaise réponse, essaie encore !</span>";
      }
    }

    submitBtn.addEventListener('click', checkAnswer);
    puzzleInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkAnswer();
    });
  </script>
</body>
</html>
