<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accès Suspendu</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1a0505 0%, #050505 100%);
      color: #f5f5f5;
      font-family: 'Segoe UI', system-ui, sans-serif;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }
    .container {
      max-width: 600px;
      animation: fadeIn 1.5s ease-out;
    }
    .status {
      display: inline-block;
      color: #ef4444;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      margin-bottom: 18px;
      animation: pulse 2s infinite;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 16px;
      text-shadow: 0 0 25px rgba(239, 68, 68, 0.35);
    }
    p {
      color: #9ca3af;
      font-size: 1.05rem;
      line-height: 1.6;
      letter-spacing: 0.03em;
    }
    .line {
      width: 80px;
      height: 2px;
      background: #ef4444;
      margin: 24px auto;
      box-shadow: 0 0 12px #ef4444;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="status">● Signal interrompu</span>
    <h1>Ce monde est fermé</h1>
    <div class="line"></div>
    <p>L'accès a été coupé temporairement.</p>
  </div>
</body>
</html>
