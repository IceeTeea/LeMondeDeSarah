<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mise à jour Système — Édition Cosmos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: #03050a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow: hidden;
      position: relative;
    }

    #space-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* Halo lumineux d'arrière-plan */
    .ambient-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(212, 175, 55, 0.08) 40%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      animation: floatGlow 8s infinite ease-in-out;
    }

    @keyframes floatGlow {
      0%, 100% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.15) translate(-20px, 15px); }
    }

    /* Carte Interface Futuriste */
    .command-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 580px;
      background: rgba(8, 12, 22, 0.75);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 32px;
      padding: 3.5rem 2.5rem;
      text-align: center;
      box-shadow: 0 50px 120px -20px rgba(0, 0, 0, 0.95),
                  0 0 40px rgba(168, 85, 247, 0.1),
                  inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    /* Orbe Holographique Central */
    .orb-container {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto 2rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orb-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px dashed rgba(212, 175, 55, 0.4);
      animation: rotateRing 12s linear infinite;
    }

    .orb-ring-reverse {
      position: absolute;
      width: 82%;
      height: 82%;
      border-radius: 50%;
      border: 1px solid rgba(168, 85, 247, 0.5);
      border-top-color: transparent;
      animation: rotateRing 6s linear infinite reverse;
    }

    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .orb-core {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fef08a, #d97706 40%, #7e22ce 80%);
      box-shadow: 0 0 35px rgba(212, 175, 55, 0.6), 0 0 60px rgba(168, 85, 247, 0.4);
      animation: orbPulse 3s infinite ease-in-out;
      position: relative;
      z-index: 2;
    }

    @keyframes orbPulse {
      0%, 100% { transform: scale(0.95); box-shadow: 0 0 30px rgba(212, 175, 55, 0.5); }
      50% { transform: scale(1.08); box-shadow: 0 0 50px rgba(212, 175, 55, 0.8), 0 0 80px rgba(168, 85, 247, 0.6); }
    }

    /* Badge Statut */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(168, 85, 247, 0.15));
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: #fef08a;
      padding: 0.5rem 1.2rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background-color: #fef08a;
      border-radius: 50%;
      box-shadow: 0 0 10px #fef08a;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 0.02em;
      margin-bottom: 0.85rem;
      background: linear-gradient(135deg, #ffffff 0%, #fef08a 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-text {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      font-weight: 300;
      min-height: 3em;
      margin-bottom: 2rem;
    }

    /* Barre de progression avec éclat néon */
    .progress-section {
      margin-bottom: 2rem;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 0.6rem;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 1%;
      background: linear-gradient(90deg, #d97706, #fef08a, #c084fc);
      border-radius: 9999px;
      box-shadow: 0 0 15px rgba(254, 240, 138, 0.7);
      transition: width 0.5s ease;
    }

    .time-remaining {
      font-size: 0.85rem;
      color: #e2e8f0;
      letter-spacing: 0.05em;
      margin-top: 0.8rem;
    }

    /* Panneau de télémétrie en bas */
    .telemetry-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .telemetry-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 0.75rem 0.5rem;
    }

    .telemetry-value {
      font-size: 0.9rem;
      font-weight: 600;
      color: #fef08a;
      display: block;
    }

    .telemetry-label {
      font-size: 0.68rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 0.2rem;
    }

    .interactive-hint {
      font-size: 0.75rem;
      color: #475569;
      margin-top: 1.5rem;
      font-style: italic;
    }
  </style>
</head>
<body>

  <canvas id="space-canvas"></canvas>
  <div class="ambient-glow"></div>

  <div class="command-card" id="card">
    <div class="status-badge">
      <span class="pulse-dot"></span>
      Déploiement Orbital
    </div>

    <!-- Orbe Visuel -->
    <div class="orb-container">
      <div class="orb-ring"></div>
      <div class="orb-ring-reverse"></div>
      <div class="orb-core"></div>
    </div>

    <h1>Mise à jour Système</h1>
    
    <p class="status-text" id="status-text">Initialisation du noyau de données...</p>

    <!-- Progression globale -->
    <div class="progress-section">
      <div class="progress-header">
        <span>Progression Globale</span>
        <span id="percent-label" style="color:#fef08a; font-weight: 700;">1%</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="time-remaining" id="time-remaining">Calcul du temps restant...</div>
    </div>

    <!-- Télémétrie en temps réel -->
    <div class="telemetry-grid">
      <div class="telemetry-box">
        <span class="telemetry-value" id="fps-val">60 FPS</span>
        <span class="telemetry-label">Fluidité</span>
      </div>
      <div class="telemetry-box">
        <span class="telemetry-value">AES-256</span>
        <span class="telemetry-label">Sécurité</span>
      </div>
      <div class="telemetry-box">
        <span class="telemetry-value" id="ping-val">12 ms</span>
        <span class="telemetry-label">Latence</span>
      </div>
    </div>

    <div class="interactive-hint">✨ Touchez l'écran ou cliquez pour générer des étincelles</div>
  </div>

  <script>
    // --- 1. Canvas d'étoiles et de particules interactives ---
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let stars = [];
    let sparks = [];
    let mouse = { x: -1000, y: -1000 };

    function initCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      stars = [];
      for (let i = 0; i < 90; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 1.8 + 0.2,
          alpha: Math.random() * 0.8 + 0.2,
          speed: Math.random() * 0.3 + 0.05
        });
      }
    }
    window.addEventListener('resize', initCanvas);
    initCanvas();

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    // Clic / Tap interactif générant des étincelles
    window.addEventListener('click', (e) => {
      for (let i = 0; i < 15; i++) {
        sparks.push({
          x: e.clientX,
          y: e.clientY,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          size: Math.random() * 3 + 1,
          color: Math.random() > 0.5 ? '#fef08a' : '#c084fc',
          life: 1
        });
      }
    });

    function renderBackground() {
      ctx.clearRect(0, 0, width, height);

      // Dessin des étoiles
      stars.forEach(s => {
        s.y -= s.speed;
        if (s.y < 0) s.y = height;

        ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Dessin des étincelles interactives
      for (let i = sparks.length - 1; i >= 0; i--) {
        let p = sparks[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02;

        if (p.life <= 0) {
          sparks.splice(i, 1);
        } else {
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.life;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }

      requestAnimationFrame(renderBackground);
    }
    renderBackground();

    // --- 2. Calcul du pourcentage en temps réel (19/10/2026 jusqu'à 12:00) ---
    const startTime = new Date(2026, 9, 19, 0, 50, 0).getTime(); // 19 Octobre 2026, 00:50
    const endTime = new Date(2026, 9, 19, 12, 0, 0).getTime();   // 19 Octobre 2026, 12:00

    const progressFill = document.getElementById('progress-fill');
    const percentLabel = document.getElementById('percent-label');
    const statusText = document.getElementById('status-text');
    const timeRemaining = document.getElementById('time-remaining');
    const pingVal = document.getElementById('ping-val');

    function updateProgress() {
      const now = new Date().getTime();
      const totalDuration = endTime - startTime;
      const elapsed = now - startTime;

      let percentage = (elapsed / totalDuration) * 100;
      if (percentage < 1) percentage = 1;
      if (percentage >= 100) percentage = 100;

      const roundedPercent = Math.floor(percentage);
      percentLabel.innerText = roundedPercent + "%";
      progressFill.style.width = percentage + "%";

      // Temps restant
      const timeLeftMs = endTime - now;
      if (timeLeftMs > 0) {
        const hours = Math.floor(timeLeftMs / (1000 * 60 * 60));
        const minutes = Math.floor((timeLeftMs % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((timeLeftMs % (1000 * 60)) / 1000);
        timeRemaining.innerText = `Fin prévue dans : ${hours}h ${minutes}m ${seconds}s`;
      } else {
        timeRemaining.innerText = "✨ Mise à jour terminée ! Ouverture imminente...";
      }

      // Changement dynamique des phrases d'avancement
      if (percentage < 30) {
        statusText.innerText = "Compilation des scripts CSS & optimisation des performances...";
      } else if (percentage < 65) {
        statusText.innerText = "Synchronisation des bases de données et des modules graphiques...";
      } else if (percentage < 95) {
        statusText.innerText = "Tests de sécurité et calibrage final des interfaces...";
      } else {
        statusText.innerText = "Tout est prêt ! Finalisation du déploiement...";
      }

      // Variation amusante du ping
      pingVal.innerText = (10 + Math.floor(Math.random() * 5)) + " ms";
    }

    setInterval(updateProgress, 1000);
    updateProgress();
  </script>
</body>
</html>
