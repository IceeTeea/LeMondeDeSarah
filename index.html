<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mise à jour Système — Édition Cosmos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: #03050a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow: hidden;
      position: relative;
    }

    #space-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* Halo lumineux d'arrière-plan */
    .ambient-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(212, 175, 55, 0.08) 40%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      animation: floatGlow 8s infinite ease-in-out;
    }

    @keyframes floatGlow {
      0%, 100% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.15) translate(-20px, 15px); }
    }

    /* Carte Interface Futuriste */
    .command-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 580px;
      background: rgba(8, 12, 22, 0.75);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 32px;
      padding: 3.2rem 2.5rem;
      text-align: center;
      box-shadow: 0 50px 120px -20px rgba(0, 0, 0, 0.95),
                  0 0 40px rgba(168, 85, 247, 0.1),
                  inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    /* Orbe Holographique Central */
    .orb-container {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 1.5rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orb-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px dashed rgba(212, 175, 55, 0.4);
      animation: rotateRing 12s linear infinite;
    }

    .orb-ring-reverse {
      position: absolute;
      width: 82%;
      height: 82%;
      border-radius: 50%;
      border: 1px solid rgba(168, 85, 247, 0.5);
      border-top-color: transparent;
      animation: rotateRing 6s linear infinite reverse;
    }

    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .orb-core {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fef08a, #d97706 40%, #7e22ce 80%);
      box-shadow: 0 0 35px rgba(212, 175, 55, 0.6), 0 0 60px rgba(168, 85, 247, 0.4);
      animation: orbPulse 3s infinite ease-in-out;
      position: relative;
      z-index: 2;
    }

    @keyframes orbPulse {
      0%, 100% { transform: scale(0.95); box-shadow: 0 0 30px rgba(212, 175, 55, 0.5); }
      50% { transform: scale(1.08); box-shadow: 0 0 50px rgba(212, 175, 55, 0.8), 0 0 80px rgba(168, 85, 247, 0.6); }
    }

    /* Badge Statut */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(168, 85, 247, 0.15));
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: #fef08a;
      padding: 0.45rem 1.1rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background-color: #fef08a;
      border-radius: 50%;
      box-shadow: 0 0 10px #fef08a;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0.02em;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #ffffff 0%, #fef08a 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-text {
      color: #94a3b8;
      font-size: 0.9rem;
      line-height: 1.6;
      font-weight: 300;
      min-height: 2.8em;
      margin-bottom: 1.75rem;
    }

    /* Barre de progression avec éclat néon */
    .progress-section {
      margin-bottom: 1.75rem;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 0.5rem;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 1%;
      background: linear-gradient(90deg, #d97706, #fef08a, #c084fc);
      border-radius: 9999px;
      box-shadow: 0 0 15px rgba(254, 240, 138, 0.7);
      transition: width 0.5s ease;
    }

    .time-remaining {
      font-size: 0.85rem;
      color: #e2e8f0;
      letter-spacing: 0.05em;
      margin-top: 0.75rem;
    }

    /* BOUTON ÉPINGLE PATCH NOTE */
    .patch-pin-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: #fef08a;
      padding: 0.65rem 1.4rem;
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 0.5rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .patch-pin-btn:hover {
      background: rgba(212, 175, 55, 0.15);
      border-color: rgba(212, 175, 55, 0.6);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.2);
    }

    /* MODALE HOLOGRAPHIQUE PATCH NOTE */
    .patch-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(3, 5, 10, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .patch-modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .patch-card {
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      background: rgba(12, 17, 30, 0.9);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 28px;
      padding: 2.5rem;
      overflow-y: auto;
      text-align: left;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9), 0 0 50px rgba(168, 85, 247, 0.15);
      transform: scale(0.9);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .patch-modal-overlay.active .patch-card {
      transform: scale(1);
    }

    .patch-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .patch-title {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: #fef08a;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.2s ease;
    }

    .close-btn:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    .patch-tag {
      display: inline-block;
      background: rgba(168, 85, 247, 0.2);
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: #c084fc;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .patch-section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #cbd5e1;
      margin: 1.25rem 0 0.75rem 0;
      font-weight: 600;
    }

    .patch-list {
      list-style: none;
    }

    .patch-list li {
      font-size: 0.88rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 0.6rem;
      padding-left: 1.25rem;
      position: relative;
    }

    .patch-list li::before {
      content: "✦";
      position: absolute;
      left: 0;
      color: #fef08a;
      font-size: 0.75rem;
    }

    /* Personalisation Scrollbar */
    .patch-card::-webkit-scrollbar {
      width: 6px;
    }
    .patch-card::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.2);
    }
    .patch-card::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.3);
      border-radius: 10px;
    }

    .interactive-hint {
      font-size: 0.75rem;
      color: #475569;
      margin-top: 1.5rem;
      font-style: italic;
    }
  </style>
</head>
<body>

  <canvas id="space
