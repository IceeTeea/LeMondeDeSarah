<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mise à jour en cours...</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #090d16;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      overflow: hidden;
      position: relative;
    }

    /* Effets de lumière en arrière-plan */
    .glow-1 {
      position: absolute;
      top: -10%;
      left: 20%;
      width: 350px;
      height: 350px;
      background: rgba(99, 102, 241, 0.25);
      filter: blur(120px);
      border-radius: 50%;
      z-index: 0;
    }
    .glow-2 {
      position: absolute;
      bottom: -10%;
      right: 20%;
      width: 350px;
      height: 350px;
      background: rgba(168, 85, 247, 0.2);
      filter: blur(120px);
      border-radius: 50%;
      z-index: 0;
    }

    /* Carte principale */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
    }

    /* Badge avec voyant animé */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      padding: 0.45rem 1rem;
      border-radius: 9999px;
      font-size: 0.825rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin-bottom: 1.75rem;
    }
    .pulse {
      width: 8px;
      height: 8px;
      background-color: #818cf8;
      border-radius: 50%;
      box-shadow: 0 0 12px #818cf8;
      animation: blink 1.6s infinite ease-in-out;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.85rem;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 0.975rem;
      line-height: 1.65;
      margin-bottom: 2.25rem;
    }

    /* Barre de progression avec effet néon */
    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }
    .progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
      border-radius: 9999px;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.5);
      animation: loading 2.2s infinite ease-in-out;
    }
    @keyframes loading {
      0% { left: -45%; }
      100% { left: 100%; }
    }

    /* Pied de carte subtil */
    .footer-note {
      margin-top: 1.75rem;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="card">
    <div class="status-badge">
      <span class="pulse"></span>
      Maintenance système
    </div>
    <h1>Mise à jour en cours</h1>
    <p>De nouvelles fonctionnalités et améliorations sont en train d'être déployées. Le site sera de retour dans quelques instants.</p>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
    <div class="footer-note">Merci pour votre patience ⚡</div>
  </div>
</body>
</html>
